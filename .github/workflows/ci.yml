name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all 49 flight witnesses (slower)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22.16.0
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 15 || 5 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify routine checks
        if: ${{ !inputs.full }}
        run: npm run verify
      - name: Verify all flights
        if: ${{ inputs.full }}
        run: npm run verify:full
      - uses: actions/upload-artifact@v4
        with:
          name: pendulum-airlines
          path: dist/index.html
          if-no-files-found: error
